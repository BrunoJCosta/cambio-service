server:
  port: ${PORT}

eureka:
  client:
    serviceUrl:
      defaultZone: http://${HOST_EUREKA}:8761/eureka

spring:
  application:
    name: cambio-service

  datasource:
    url: jdbc:postgresql://${HOST_DB}/cambio?sslmode=require&channelBinding=require
    username: ${USER_DB}
    password: ${PASSWORD_DB}

  flyway:
    url: jdbc:postgresql://${HOST_DB}/cambio?sslmode=require&channelBinding=require
    schemas: cambio_server
    user: ${USER_DB}
    password: ${PASSWORD_DB}

  sql:
    init:
      mode: always
      encoding: utf-8

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    open-in-view: false

  cache:
    type: redis

security:
  jwt:
    public-key: classpath:keys/public.pem
    secret: ${SECRET}